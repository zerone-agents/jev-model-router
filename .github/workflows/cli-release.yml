name: CLI Release
on:
  pull_request:
    paths:
      - scripts/package-cli.py
      - .github/workflows/cli-release.yml
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cli-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: release-source/go.sum
      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            RELEASE_TAG="v$(sed -n 's/^const Version = "\(.*\)"/\1/p' release-source/internal/transport/cli/run.go)"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then exit 1; fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Package CLI
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/package-cli.py --source release-source --version "$RELEASE_TAG" --output "$RUNNER_TEMP/cli-assets"
      - name: Verify native binary and checksums
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/cli-assets"
          sha256sum -c SHA256SUMS
          tar -xzf "jev-router_${RELEASE_TAG#v}_linux_amd64.tar.gz"
          binary="jev-router_${RELEASE_TAG#v}_linux_amd64/jev-router"
          test "$("$binary" --version)" = "${RELEASE_TAG#v}"
          "$binary" --help
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: cli-assets
          path: |
            ${{ runner.temp }}/cli-assets/*.tar.gz
            ${{ runner.temp }}/cli-assets/*.zip
            ${{ runner.temp }}/cli-assets/SHA256SUMS
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-assets
          path: cli-assets
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Release notes pending.'
          fi
          gh release upload "$RELEASE_TAG" cli-assets/*
