name: D3
on:
  push:
    tags: ['d3-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'D3 image version (for example 0.1.0; no v prefix)'
        required: true
        type: string
concurrency:
  group: d3-${{ inputs.version && format('d3-v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/d3-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate version and image repositories
        id: release
        env:
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ vars.DOCKERHUB_D3_IMAGE }}
          MIRROR: ${{ vars.REGISTRY_D3_IMAGE }}
          HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          set -eu
          if [ "$EVENT" != workflow_dispatch ]; then
            VERSION="${REF_NAME#d3-v}"
          fi
          echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$IMAGE" | grep -Eq '^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$'
          if [ -n "$MIRROR" ]; then
            test -n "$HOST"
            case "$MIRROR" in "$HOST"/*) ;; *) exit 1;; esac
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: vars.REGISTRY_D3_IMAGE != ''
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/d3/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          push: true
          tags: |
            ${{ vars.DOCKERHUB_D3_IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
            ${{ vars.REGISTRY_D3_IMAGE != '' && format('{0}:build-{1}-{2}-{3}', vars.REGISTRY_D3_IMAGE, github.run_id, github.run_attempt, matrix.arch) || '' }}
      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: d3-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1

  manifest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/d3-v')
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: vars.REGISTRY_D3_IMAGE != ''
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: d3-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish Docker manifest lists
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          IMAGE: ${{ vars.DOCKERHUB_D3_IMAGE }}
          MIRROR: ${{ vars.REGISTRY_D3_IMAGE }}
        run: |
          set -eu
          version="${VERSION#d3-v}"
          amd64="$(cat "$RUNNER_TEMP/digests/amd64")"
          arm64="$(cat "$RUNNER_TEMP/digests/arm64")"
          printf '%s\n%s\n' "$amd64" "$arm64" | grep -Ec '^sha256:[0-9a-f]{64}$' | grep -qx 2
          for image in "$IMAGE" "$MIRROR"; do
            [ -n "$image" ] || continue
            docker manifest create "$image:$version" "$image@$amd64" "$image@$arm64"
            docker manifest push "$image:$version"
            case "$version" in
              *-*) ;;
              *) docker manifest create "$image:latest" "$image@$amd64" "$image@$arm64"
                 docker manifest push "$image:latest" ;;
            esac
          done
