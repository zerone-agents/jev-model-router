name: Laya
on:
  pull_request:
    paths:
      - services/laya/**
      - quickstart/docker-compose.laya*.yml
      - .github/workflows/laya.yml
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.28'
      - name: Unit and lifecycle tests
        working-directory: services/laya
        run: uv run --frozen pytest -q
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate real Router fixtures
        run: LAYA_FIXTURE_OUTPUT=${{ runner.temp }}/laya-requests.json go test ./internal/decision -run TestLayaDecisionFixtures -count=1
      - name: Provision pinned model and test real inference
        working-directory: services/laya
        env:
          LAYA_MODEL_DIR: ${{ runner.temp }}/laya-models/current
          LAYA_REAL_MODEL: ${{ runner.temp }}/laya-models/current
          LAYA_FIXTURES: ${{ runner.temp }}/laya-requests.json
        run: |
          uv run --frozen python -m jev_laya.provision --destination "${{ runner.temp }}/laya-models"
          uv run --frozen pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Build native image without publishing
        uses: docker/build-push-action@v6
        with:
          context: services/laya
          platforms: linux/arm64
          load: true
          tags: jev-laya:ci
          provenance: false
          sbom: false
      - name: Verify missing weights fail readiness
        run: |
          docker run -d --name laya-ci --network none -e LAYA_API_KEY=ci-only jev-laya:ci
          docker exec laya-ci python -c 'import time,urllib.request,urllib.error; time.sleep(5); assert urllib.request.urlopen("http://127.0.0.1:8090/health/live").status == 200; exec("try:\n urllib.request.urlopen(\"http://127.0.0.1:8090/health/ready\")\n raise AssertionError(\"missing weights became ready\")\nexcept urllib.error.HTTPError as e:\n assert e.code == 503")'
      - name: Cleanup
        if: always()
        run: docker rm -f laya-ci || true
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate image repositories
        env:
          IMAGE: ${{ vars.DOCKERHUB_LAYA_IMAGE }}
          MIRROR: ${{ vars.REGISTRY_LAYA_IMAGE }}
          HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          set -eu
          echo "$IMAGE" | grep -Eq '^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$'
          if [ -n "$MIRROR" ]; then
            test -n "$HOST"
            case "$MIRROR" in "$HOST"/*) ;; *) exit 1;; esac
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: vars.REGISTRY_LAYA_IMAGE != ''
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ vars.DOCKERHUB_LAYA_IMAGE }}
            ${{ vars.REGISTRY_LAYA_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: services/laya
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
