name: Release
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - quickstart/**
      - .github/workflows/release.yml
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: zeroneai/jev-model-router
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) }}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  smoke:
    runs-on: ubuntu-latest
    env:
      JEV_ROUTER_SETTINGS_TOKEN: ci-settings-only
      JEV_ROUTER_INFERENCE_TOKEN: ci-inference-only
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        working-directory: quickstart
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait --wait-timeout 120
      - name: Verify UI and SQLite persistence
        working-directory: quickstart
        shell: bash
        run: |
          set -euo pipefail
          curl --fail http://127.0.0.1:8080/dashboard/ | grep -q '<html'
          call() { docker compose exec -T router jev-router call "$@"; }
          version=$(printf '{}' | call status.get --json - | jq -er '.data.version')
          printf '{"text":"Compose persistence check"}' | call prompt.put --json - --expected-version "$version" --idempotency-key compose-smoke | jq -e '.ok == true'
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --no-build --wait --wait-timeout 120
          call prompt.get | jq -e '.data.text == "Compose persistence check"'
      - name: Container logs
        if: always()
        working-directory: quickstart
        run: docker compose logs router
      - name: Clean up
        if: always()
        working-directory: quickstart
        run: docker compose down -v
