services:
  router:
    environment:
      DECISION_API_KEY: ${DECISION_API_KEY:?Set a dedicated decision token}
  decider:
    image: ${DECIDER_IMAGE:-zeroneai/jev-model-router-decider:latest}
    restart: unless-stopped
    environment:
      DECISION_API_KEY: ${DECISION_API_KEY:?Set a dedicated decision token}
      DECISION_DEVICE: ${DECISION_DEVICE:-cpu}
      DECISION_MODEL_ALIAS: ${DECISION_MODEL_ALIAS:-decider}
      DECISION_CONTEXT_TOKENS: ${DECISION_CONTEXT_TOKENS:-8192}
    volumes:
      - decider_models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  decider-provision:
    image: ${DECIDER_IMAGE:-zeroneai/jev-model-router-decider:latest}
    profiles: [provision]
    command: [python, -m, decision_common.provision, --manifest, /app/model-manifest.json, --destination, /models]
    volumes:
      - decider_models:/models
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  decider_models:
