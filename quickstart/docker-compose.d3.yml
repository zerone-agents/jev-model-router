services:
  router:
    environment:
      DECISION_API_KEY: ${DECISION_API_KEY:?Set a dedicated decision token}
  d3:
    image: ${D3_IMAGE:-zeroneai/jev-model-router-d3:latest}
    restart: unless-stopped
    environment:
      DECISION_API_KEY: ${DECISION_API_KEY:?Set a dedicated decision token}
      DECISION_DEVICE: ${DECISION_DEVICE:-cpu}
      DECISION_MODEL_ALIAS: ${DECISION_MODEL_ALIAS:-d3}
      DECISION_CONTEXT_TOKENS: ${DECISION_CONTEXT_TOKENS:-8192}
      D3_VARIANT: ${D3_VARIANT:-nano}
    volumes:
      - d3_models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:exec,size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  d3-provision:
    image: ${D3_IMAGE:-zeroneai/jev-model-router-d3:latest}
    profiles: [provision]
    command: [python, -m, decision_common.provision, --destination, /models]
    environment:
      D3_VARIANT: ${D3_VARIANT:-nano}
    volumes:
      - d3_models:/models
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  d3_models:
