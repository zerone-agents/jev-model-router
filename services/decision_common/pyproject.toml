[project]
name = "jev-local-decisions"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0",
  "transformers==5.22.1",
  "decider-ai==1.10.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decision_common"]
