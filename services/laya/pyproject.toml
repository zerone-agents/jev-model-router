[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "jev-laya"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "laya",
  "torch==2.15.0",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "starlette>=0.49,<1",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
laya = { git = "https://github.com/NandhaKishorM/laya.git", rev = "fe9a6c35023a7d94102e7feaaeaae8857d9d1b07" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_model: requires pinned model artifacts"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_laya"]

[tool.hatch.build.targets.wheel.force-include]
"model-manifest.json" = "jev_laya/model-manifest.json"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
